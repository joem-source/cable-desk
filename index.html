<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Gotham Cable Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: work-order desk. Left rail = queue / search results, right = the cable sheet (a modern take on the FormDocs form, yellow fill cells included). */
:root{
  --bg:#f3f3ef; --panel:#ffffff; --ink:#16171a; --muted:#62656d; --line:#d9d9d2; --line-strong:#16171a;
  --field:#fff8cf; --field-edit:#fffbe3; --field-line:#e3d98f;
  --accent:#1f4fd1; --accent-ink:#ffffff; --accent-soft:#e6ecfb;
  --from:#1f4fd1; --to:#c4302b;
  --ok:#1d7a46; --ok-soft:#e1f2e7; --warn:#a45f00; --warn-soft:#fbefd9; --bad:#b3261e; --bad-soft:#fbe4e2; --idle:#6b6e76; --idle-soft:#ececea;
  --hover:#f4f4ef; --sel:#e6ecfb;
  --f-display:"Jost","Futura","Avenir Next","Century Gothic",system-ui,sans-serif;
  --f-body:"Jost","Avenir Next",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121315; --panel:#1b1c1f; --ink:#ececea; --muted:#9a9ca3; --line:#2e3034; --line-strong:#ececea;
  --field:#2a2717; --field-edit:#24221a; --field-line:#4a4527;
  --accent:#7d9cff; --accent-ink:#0d1020; --accent-soft:#222a44;
  --from:#7d9cff; --to:#ff7a72;
  --ok:#6fd39a; --ok-soft:#173023; --warn:#f0b35a; --warn-soft:#33270f; --bad:#ff8a80; --bad-soft:#3a1a18; --idle:#a3a5ab; --idle-soft:#26282c;
  --hover:#222327; --sel:#222a44; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121315; --panel:#1b1c1f; --ink:#ececea; --muted:#9a9ca3; --line:#2e3034; --line-strong:#ececea;
  --field:#2a2717; --field-edit:#24221a; --field-line:#4a4527;
  --accent:#7d9cff; --accent-ink:#0d1020; --accent-soft:#222a44;
  --from:#7d9cff; --to:#ff7a72;
  --ok:#6fd39a; --ok-soft:#173023; --warn:#f0b35a; --warn-soft:#33270f; --bad:#ff8a80; --bad-soft:#3a1a18; --idle:#a3a5ab; --idle-soft:#26282c;
  --hover:#222327; --sel:#222a44; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.4}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* sign in */
.signin{display:none;min-height:100vh;align-items:center;justify-content:center;padding:24px max(16px,env(safe-area-inset-left,0px))}
body.signed-out .signin{display:flex}
body.signed-out .top, body.signed-out .wrap{display:none}
.signin-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:32px;max-width:400px;width:100%;display:grid;gap:14px;text-align:center}
.signin-card b{font-family:var(--f-display);letter-spacing:.28em;font-size:22px;font-weight:600}
.signin-card p{margin:0;color:var(--muted)}
.who{font-size:13px;color:var(--muted)}

/* top bar */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--panel);border-bottom:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;
  display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;font-family:var(--f-display)}
.brand b{font-weight:600;letter-spacing:.28em;font-size:17px}
.brand span{color:var(--muted);font-size:14px}
.tabs{display:flex;gap:4px}
.tab{border:0;background:none;padding:7px 12px;border-radius:6px;cursor:pointer;color:var(--muted);font-weight:500;display:flex;gap:6px;align-items:center}
.tab:hover{background:var(--hover);color:var(--ink)}
.tab[aria-selected="true"]{background:var(--ink);color:var(--panel)}
.tab .ct{font-family:var(--f-mono);font-size:12px;opacity:.8}
.spacer{flex:1}
.btn{border:1px solid var(--line);background:var(--panel);padding:7px 13px;border-radius:6px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:none}
.btn.ghost:hover{background:var(--hover)}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sm{padding:4px 9px;font-size:13px}

/* layout */
.wrap{display:grid;grid-template-columns:minmax(300px,400px) minmax(0,1fr);gap:0;min-height:calc(100% - 60px)}
.rail{border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-width:0;max-height:calc(100vh - 58px);position:sticky;top:58px}
.rail-head{padding:14px 16px 10px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--line)}
.search{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:0 10px;background:var(--bg)}
.search:focus-within{border-color:var(--accent)}
.search input{border:0;background:none;padding:9px 0;flex:1;min-width:0;outline:none}
.search svg{flex:none;color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;padding:3px 8px;border-radius:999px;background:var(--accent-soft);color:var(--ink)}
.chip button{border:0;background:none;cursor:pointer;padding:0;color:var(--muted);font-size:15px;line-height:1}
.hint{font-size:12.5px;color:var(--muted)}
.list{overflow:auto;flex:1}
.grp{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:12px 16px 6px;display:flex;justify-content:space-between;position:sticky;top:0;background:var(--panel);z-index:1}
.grp.overdue{color:var(--bad)}
.row{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px 16px;border-bottom:1px solid var(--line);cursor:pointer;text-align:left;width:100%;background:none;border-left:0;border-right:0;border-top:0}
.row:hover{background:var(--hover)}
.row[aria-current="true"]{background:var(--sel)}
.row .cust{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .meta{font-size:12.5px;color:var(--muted);text-align:right;white-space:nowrap}
.row .build{grid-column:1/-1;font-family:var(--f-mono);font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .build b{color:var(--ink);font-weight:500}
.more{padding:14px 16px}
.empty{padding:32px 20px;color:var(--muted);text-align:center}

/* pills */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--idle-soft);color:var(--idle);white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.s-submitted{background:var(--accent-soft);color:var(--accent)}
.pill.s-inbuild{background:var(--warn-soft);color:var(--warn)}
.pill.s-ready{background:var(--ok-soft);color:var(--ok)}
.pill.s-pickedup{background:var(--idle-soft);color:var(--idle)}
.pill.s-waitingonparts{background:var(--bad-soft);color:var(--bad)}
.pill.s-ready{background:var(--ok-soft);color:var(--ok)}
.pill.s-onhold{background:var(--warn-soft);color:var(--warn)}
.pill.s-cancelled{background:var(--bad-soft);color:var(--bad)}
.pill.s-archived::before{display:none}

/* sheet */
.main{min-width:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 60px}
.sheet{max-width:980px;margin:0 auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.sheet-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:16px 20px;border-bottom:2px solid var(--line-strong)}
.ordno{font-family:var(--f-display);font-size:26px;font-weight:600;letter-spacing:.02em}
.ordno small{font-size:13px;font-weight:500;color:var(--muted);letter-spacing:.14em;text-transform:uppercase;margin-right:8px}
.actions{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.sec{padding:16px 20px;display:grid;gap:12px}
.sec + .sec{border-top:1px solid var(--line)}
.sec-title{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px 28px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px 28px}
.fields{display:grid;gap:6px}
.f{display:grid;grid-template-columns:118px minmax(0,1fr);align-items:stretch;border:1px solid var(--line);border-radius:5px;overflow:hidden;min-height:36px}
.f > label,.f > .lbl{padding:8px 10px;font-size:13.5px;color:var(--muted);display:flex;align-items:center;border-right:1px solid var(--line);background:var(--panel)}
.f .val{background:var(--field);padding:8px 10px;min-width:0;overflow-wrap:anywhere;display:flex;align-items:center;gap:8px}
.f .val.mono{font-size:14px}
.f input,.f select{border:0;background:var(--field-edit);padding:8px 10px;width:100%;min-width:0;outline:none}
.f input:focus,.f select:focus,.f textarea:focus{background:var(--field);box-shadow:inset 0 -2px 0 var(--accent)}
.f.req > label::after{content:" *";color:var(--bad);margin-left:2px}
.f.err{border-color:var(--bad)}
.errmsg{color:var(--bad);font-size:13px}
.copyable{cursor:pointer;border-bottom:1px dotted var(--muted)}
.linkish{background:none;border:0;padding:0;color:var(--accent);cursor:pointer;text-align:left;font-weight:600}

/* from / to */
.ft{display:grid;grid-template-columns:1fr 44px 1fr;gap:0;align-items:start}
.ft .arrow{display:flex;justify-content:center;padding-top:44px;color:var(--muted)}
.side{display:grid;gap:6px;min-width:0}
.side-title{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:600;font-size:16px}
.side-title i{width:10px;height:10px;border-radius:2px;background:var(--from)}
.side.to .side-title i{background:var(--to)}
.side-title span{font-family:var(--f-body);font-weight:400;font-size:13px;color:var(--muted)}
.conn{display:grid;grid-template-columns:30px minmax(0,1fr);border:1px solid var(--line);border-radius:5px;overflow:hidden;min-height:36px}
.conn .n{display:flex;align-items:center;justify-content:center;font-family:var(--f-mono);font-size:12.5px;color:var(--muted);border-right:1px solid var(--line)}
.conn .val{background:var(--field);padding:8px 10px;font-family:var(--f-mono);font-size:14px;overflow-wrap:anywhere}
.conn input{border:0;background:var(--field-edit);padding:8px 10px;font-family:var(--f-mono);font-size:14px;width:100%;min-width:0;outline:none}
.conn input:focus{background:var(--field);box-shadow:inset 0 -2px 0 var(--accent)}
.notes-view{background:var(--field);border:1px solid var(--line);border-radius:5px;padding:10px 12px;white-space:pre-wrap;overflow-wrap:anywhere;min-height:70px}
textarea.notes{width:100%;min-height:120px;border:1px solid var(--line);border-radius:5px;background:var(--field-edit);padding:10px 12px;resize:vertical;outline:none}
textarea.notes:focus{border-color:var(--accent);background:var(--field)}
.quick{display:flex;gap:6px;flex-wrap:wrap}
.quick button{border:1px dashed var(--line);background:none;border-radius:999px;padding:3px 10px;font-size:12.5px;cursor:pointer;color:var(--muted)}
.quick button:hover{border-color:var(--accent);color:var(--accent)}

/* similar builds */
.similar{display:grid;gap:8px}
.sim{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
.sim .t{font-family:var(--f-mono);font-size:13px;min-width:0;overflow-wrap:anywhere}
.sim .d{font-size:12.5px;color:var(--muted);grid-column:1/2;white-space:pre-wrap;overflow-wrap:anywhere;max-height:3.9em;overflow:hidden}
.sim .act{grid-row:1/3;grid-column:2;display:flex;flex-direction:column;gap:4px;align-items:flex-end}

/* history */
.revs{display:grid;gap:6px;font-size:13.5px}
.rev{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.rev time{font-family:var(--f-mono);font-size:12.5px;color:var(--muted);min-width:140px}
.rev .who{font-weight:600}
.rev .chg{color:var(--muted)}

/* status bar */
.statusbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.stbtn{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:4px 11px;font-size:13px;cursor:pointer}
.stbtn[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.stbtn:disabled{cursor:default}

.banner{max-width:980px;margin:0 auto 14px;padding:10px 14px;border-radius:8px;background:var(--warn-soft);color:var(--ink);font-size:14px;border:1px solid var(--line)}
.banner.info{background:var(--accent-soft)}
.placeholder{max-width:620px;margin:60px auto;text-align:center;color:var(--muted);display:grid;gap:12px;justify-items:center}
.placeholder h2{font-family:var(--f-display);font-weight:600;color:var(--ink);font-size:24px;margin:0;text-wrap:balance}
.placeholder p{margin:0}
.stats{display:flex;gap:28px;justify-content:center;flex-wrap:wrap;margin-top:8px}
.stats div{display:grid}
.stats b{font-family:var(--f-display);font-size:26px;color:var(--ink);font-weight:600}

/* combobox popup */
.pop{position:absolute;z-index:50;background:var(--panel);border:1px solid var(--ink);border-radius:6px;box-shadow:0 10px 30px rgba(0,0,0,.18);max-height:320px;overflow:auto;min-width:240px}
.pop .opt{display:flex;justify-content:space-between;gap:12px;padding:7px 10px;cursor:pointer;font-size:14px}
.pop .opt small{color:var(--muted);font-size:12px;white-space:nowrap}
.pop .opt[aria-selected="true"]{background:var(--accent-soft)}
.pop .hd{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:8px 10px 4px}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:10px 16px;border-radius:8px;z-index:60;font-size:14px;max-width:calc(100% - 32px)}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:40;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--panel);border-radius:10px;padding:20px;max-width:440px;width:100%;display:grid;gap:12px;border:1px solid var(--line)}
.modal h3{margin:0;font-family:var(--f-display);font-weight:600}
.modal textarea{width:100%;min-height:80px;border:1px solid var(--line);border-radius:6px;padding:8px 10px;background:var(--bg)}
.modal .btns{display:flex;justify-content:flex-end;gap:8px}
.back{display:none}
.loading{padding:40px;text-align:center;color:var(--muted)}

@media (max-width:860px){
  .wrap{grid-template-columns:1fr}
  .rail{position:static;max-height:none;border-right:0}
  .list{max-height:52vh}
  .grid2,.grid3{grid-template-columns:1fr}
  .ft{grid-template-columns:1fr}
  .ft .arrow{padding:6px 0;transform:rotate(90deg)}
  .f{grid-template-columns:104px minmax(0,1fr)}
  body.has-sel .rail{display:none}
  .back{display:inline-flex}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.brand{border:0;background:none;padding:0;cursor:pointer;color:var(--ink)}
.home{max-width:980px;margin:0 auto;display:grid;gap:18px}
.home-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.home-head h2{margin:0;font-family:var(--f-display);font-weight:600;font-size:26px}
.home-head p{margin:2px 0 0}
.tiles{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.tile{display:grid;gap:2px;text-align:left;padding:14px 16px;border:1px solid var(--line);border-radius:10px;background:var(--panel);cursor:pointer}
.tile:hover{border-color:var(--ink)}
.tile b{font-size:30px;font-weight:500;line-height:1.1}
.tile span{font-size:13px;color:var(--muted)}
.tile.bad b{color:var(--bad)} .tile.warn b{color:var(--warn)} .tile.ok b{color:var(--ok)}
.home-lists{gap:14px}
.home-lists .sheet{margin:0;width:100%}
.mini .row{padding:9px 0;border-left:0;border-right:0}
.mini .row:last-child{border-bottom:0}
@media (max-width:860px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.fam-h{display:flex;justify-content:space-between;margin:4px 2px 8px}
.pcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.pcard{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:grid;gap:2px;align-content:start}
.pc-top{display:flex;align-items:center;gap:6px}
.pc-top b{font-size:32px;font-weight:500;line-height:1}
.pc-name{font-size:15px;font-weight:500;overflow-wrap:anywhere}
.pc-meta{font-size:12.5px;color:var(--muted)}
.pc-meta .late{color:var(--bad)}
.pc-more{font-size:13px;margin-top:4px}
.pc-more summary{cursor:pointer;color:var(--muted)}
.pc-more .linkish{font-weight:500}
.ptable{display:grid}
.prow{display:grid;grid-template-columns:56px minmax(0,1.2fr) minmax(0,2fr) 110px;gap:12px;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--line)}
.prow:last-child{border-bottom:0}
.pq{font-size:20px;font-weight:500;text-align:right}
.pw{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:50%;background:var(--warn-soft);color:var(--warn);font-size:11px;margin-left:3px;vertical-align:middle;cursor:help}
.pn{font-size:14.5px;overflow-wrap:anywhere}
.po{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:13px}
.po .linkish{font-weight:500;font-size:13px}
.pd{font-size:12.5px;color:var(--muted);text-align:right}
.pd.late{color:var(--bad)}
@media (max-width:860px){.prow{grid-template-columns:48px minmax(0,1fr) auto}.po{grid-column:2/-1}}
.printafter{display:flex;align-items:center;gap:6px;font-size:13.5px;color:var(--muted);cursor:pointer;white-space:nowrap}
#print-sheet{display:none}
@page{size:letter;margin:.4in}
@media print{
  html,body{height:auto!important;min-height:0!important;background:#fff!important;color:#000!important;padding:0!important;margin:0!important}
  #print-sheet{break-inside:avoid}
  body > *:not(#print-sheet), body::before, .toast, .pop{display:none!important}
  #print-sheet{display:block;color:#000;font-family:"Jost","Futura","Avenir Next",sans-serif;font-size:11pt;line-height:1.25}
  #print-sheet *{color:#000!important}
  .p-head{display:grid;grid-template-columns:1fr 1.1fr 1fr;gap:.25in;align-items:start}
  .p-col{display:grid;gap:6px}
  .p-mid{text-align:center;padding-top:.2in}
  .p-logo{font-size:30pt;font-weight:700;letter-spacing:.18em}
  .p-sub{font-size:7pt;font-weight:700;letter-spacing:.08em}
  .p-title{font-size:20pt;margin-top:10px}
  .p-order{border:1.2px solid #000;padding:5px 8px;font-size:12pt;margin-bottom:2px}
  .p-order b{font-family:"IBM Plex Mono",monospace;font-size:14pt}
  .p-box{display:grid;grid-template-columns:auto 1fr;gap:8px;border:1.2px solid #000;padding:5px 8px;min-height:28px;align-items:center}
  .p-l{font-size:10pt;white-space:nowrap}
  .p-v{font-size:11pt;font-weight:500;overflow-wrap:anywhere}
  .p-rule{border-top:2px solid #000;margin:.14in 0}
  .p-row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.35in;margin-bottom:.12in;align-items:start}
  .p-tiny{font-size:7pt;text-align:right}
